services:

  # Databases
  db:
    image: postgres:15
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 10s
      retries: 5

  db-init:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    command: ["npm", "run", "db:init"]
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  # API Routes
  user-microservice:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    command: ["npm", "run", "start:users"]
    env_file:
      - .env
    depends_on:
      db-init:
        condition: service_completed_successfully

  chat-microservice:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    command: ["npm", "run", "start:chat"]
    env_file:
      - .env
    depends_on:
      db-init:
        condition: service_completed_successfully

  permissions-microservice:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    command: ["npm", "run", "start:permissions"]
    env_file:
      - .env
    depends_on:
      db-init:
        condition: service_completed_successfully

  # API Gateway
  gateway:
    image: nginx:alpine
    ports: 
      - "3000:80"
    volumes:
      - ./backend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - permissions-microservice
      - user-microservice
      - chat-microservice

  # Frontend Systems
  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:3000
    ports:
      - "5173:80"
    depends_on:
      - gateway