services:

  # Database
  db:
    image: postgres:15
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 10s
      retries: 5

  gateway:
    image: nginx:alpine
    ports: 
      - "3000:3100"
    volumes:
      - ./backend/nginx.conf

  # Frontend Systems
  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://${LOCAL_IP}:3000
    ports:
      - "5173:80"
    depends_on:
      - gateway