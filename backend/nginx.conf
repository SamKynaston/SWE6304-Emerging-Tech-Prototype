server {
    listen 80;

    location = / {
        proxy_pass http://health-microservice:3000;
    }

    location /v1/users {
        proxy_pass http://user-microservice:3000;
    }

    location /v1/chat {
        proxy_pass http://chat-microservice:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /v1/roles {
        proxy_pass http://permissions-microservice:3000;
    }
}